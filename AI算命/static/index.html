<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算命应用 - 首页</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "SimSun", "STSong", serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .start-button {
            padding: 20px 60px;
            font-size: 24px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .start-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <button class="start-button" onclick="window.location.href='/chat'">
        开始算命
    </button>
</body>
</html>
